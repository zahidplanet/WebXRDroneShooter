<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>City Drone Shooter - AR-Cade Platform</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" as="script">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            touch-action: none;
        }
        
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 300px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #00a8ff;
            transition: width 0.3s;
        }
        
        /* Game UI */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
        }
        
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        #player-stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            font-size: 18px;
            text-shadow: 1px 1px 2px #000;
        }
        
        .stat-item {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-icon {
            font-size: 20px;
            color: #fff;
        }
        
        #back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 10;
        }
        
        #back-button:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        /* Game Menu */
        #game-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        
        .menu-title {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 168, 255, 0.7);
        }
        
        .menu-button {
            background-color: #00a8ff;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .menu-button:hover {
            background-color: #0088cc;
        }
        
        /* Pause Menu */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }
        
        /* Mobile Controls */
        .mobile-controls {
            display: none;
            pointer-events: auto;
        }
        
        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        #joystick-thumb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
        
        #shoot-button {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .mobile-control-button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto;
        }
        
        /* Debug Info */
        #debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
        
        /* Loading tips */
        #loading-tips {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
    
    <!-- Load Three.js early -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
</head>
<body>
    <!-- Game Container -->
    <div id="game-container"></div>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading City Drone Shooter...</div>
        <div class="progress-bar">
            <div class="progress-bar-fill" id="loading-progress"></div>
        </div>
        <div id="loading-tips">
            Tip: Use WASD to move and mouse to look around. Click to shoot drones.
        </div>
    </div>
    
    <!-- Game UI -->
    <div id="game-ui">
        <!-- Crosshair -->
        <div id="crosshair"></div>
        
        <!-- Player Stats -->
        <div id="player-stats">
            <div class="stat-item">
                <span class="stat-icon">❤️</span>
                <span id="health">100</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🎯</span>
                <span id="score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🔫</span>
                <span id="ammo">30 / 30</span>
            </div>
        </div>
        
        <!-- Back Button -->
        <button id="back-button">Back to Lobby</button>
        
        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <div id="joystick-area">
                <div id="joystick-thumb"></div>
            </div>
            <div id="shoot-button">FIRE</div>
        </div>
    </div>
    
    <!-- Game Menu -->
    <div id="game-menu">
        <h1 class="menu-title">City Drone Shooter</h1>
        <button id="start-button" class="menu-button">Start Game</button>
        <button id="options-button" class="menu-button">Options</button>
        <button id="help-button" class="menu-button">How to Play</button>
    </div>
    
    <!-- Pause Menu -->
    <div id="pause-menu">
        <h1 class="menu-title">Game Paused</h1>
        <button id="resume-button" class="menu-button">Resume</button>
        <button id="restart-button" class="menu-button">Restart</button>
        <button id="exit-button" class="menu-button">Exit to Lobby</button>
    </div>
    
    <!-- Debug Info -->
    <div id="debug-info"></div>
    
    <!-- Scripts are loaded with defer to improve page load performance -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/PointerLockControls.js" defer></script>
    <script src="https://cdn.colyseus.io/client/0.14.13/colyseus.js" defer></script>
    
    <!-- Game Scripts -->
    <script src="js/config.js" defer></script>
    <script src="js/network.js" defer></script>
    <script src="js/city.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/drone.js" defer></script>
    <script src="js/weapon.js" defer></script>
    <script src="js/game.js" defer></script>
    
    <script>
        // Start loading animation immediately
        document.addEventListener('DOMContentLoaded', function() {
            // Show loading tips while waiting for scripts to load
            const tips = [
                "Tip: Use WASD to move and mouse to look around. Click to shoot drones.",
                "Tip: Press R to reload your weapon.",
                "Tip: Press ESC to pause the game.",
                "Tip: Drones come in different types with varying health and speed.",
                "Tip: Explore the city to find good vantage points."
            ];
            
            const loadingTips = document.getElementById('loading-tips');
            let tipIndex = 0;
            
            // Change loading tip every 5 seconds
            if (loadingTips) {
                setInterval(() => {
                    tipIndex = (tipIndex + 1) % tips.length;
                    loadingTips.textContent = tips[tipIndex];
                }, 5000);
            }
            
            // Mobile controls detection - moved to after page load
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            if (isMobile) {
                document.querySelectorAll('.mobile-controls').forEach(control => {
                    control.style.display = 'block';
                });
                
                // Adjust UI for mobile
                document.getElementById('player-stats').style.fontSize = '14px';
                document.getElementById('back-button').style.padding = '5px 10px';
                document.getElementById('back-button').style.fontSize = '14px';
            }
            
            // Resume button in pause menu
            document.getElementById('resume-button').addEventListener('click', function() {
                if (window.gameInstance) {
                    window.gameInstance.unpause();
                }
            });
            
            // Restart button in pause menu
            document.getElementById('restart-button').addEventListener('click', function() {
                window.location.reload();
            });
            
            // Exit button in pause menu
            document.getElementById('exit-button').addEventListener('click', function() {
                if (window.gameInstance) {
                    window.gameInstance.returnToLobby();
                }
            });
            
            // Options button
            document.getElementById('options-button').addEventListener('click', function() {
                alert('Controls:\nMovement: WASD\nJump: SPACE\nShoot: Left Mouse Button\nReload: R\nPause: ESC');
            });
            
            // Help button
            document.getElementById('help-button').addEventListener('click', function() {
                alert('Objective: Shoot down as many drones as possible!\n\nControls:\nMovement: WASD\nJump: SPACE\nShoot: Left Mouse Button\nReload: R\nPause: ESC');
            });
        });
    </script>
</body>
</html>
